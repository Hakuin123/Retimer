org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# 目前仍然用 JetBrains 的 Kotlin 插件（org.jetbrains.kotlin.android），不用 AGP 9 的内置 Kotlin
# 内置 Kotlin 是 AGP 9 的新方案，切过去要同时换掉插件、Kotlin 版本来源和 Compose 编译器的接入方式
# 而只要还用 Kotlin 插件，它就仍在调用 AGP 的旧变体 API，所以旧 DSL 也必须保持开启
android.builtInKotlin=false
android.newDsl=false
